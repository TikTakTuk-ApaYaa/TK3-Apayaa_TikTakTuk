<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TikTakTuk - Manajemen Event</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

    <style>
        :root {
            --sidebar-width: 260px;
            --primary-green: #1a7a4a;
            --transition-speed: 0.3s;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bs-body-bg);
            transition: background-color var(--transition-speed), color var(--transition-speed);
        }

        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            background: #111827;
            color: white;
            transition: all var(--transition-speed);
            z-index: 1000;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            overflow-y: auto;
        }

        [data-bs-theme="dark"] .sidebar {
            background: #000;
        }

        .sidebar-header {
            padding: 1.5rem;
            font-weight: 800;
            font-size: 1.25rem;
            color: var(--primary-green);
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-list {
            list-style: none;
            padding: 1rem;
            margin: 0;
        }

        .nav-item-custom {
            margin-bottom: 4px;
        }

        .nav-link-custom {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.75rem 1rem;
            color: #9ca3af;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-link-custom:hover {
            background: rgba(255, 255, 255, 0.05);
            color: white;
        }

        .nav-link-custom.active {
            background: var(--primary-green);
            color: white;
        }

        .nav-link-custom.logout-link {
            color: #f87171;
        }

        .nav-link-custom.logout-link:hover {
            background: rgba(248, 113, 113, 0.1);
            color: #f87171;
        }

        .main-content {
            margin-left: var(--sidebar-width);
            padding: 0;
            min-height: 100vh;
        }

        .top-bar {
            height: 70px;
            background: var(--bs-body-bg);
            border-bottom: 1px solid var(--bs-border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            position: sticky;
            top: 0;
            z-index: 999;
        }

        .dev-tool-dropdown .dropdown-toggle::after {
            display: none;
        }

        .theme-toggle-btn {
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--bs-secondary-color);
        }

        .event-card {
            border: 1px solid var(--bs-border-color);
            border-radius: 14px;
            overflow: hidden;
            background: var(--bs-body-bg);
            transition: transform .2s, box-shadow .2s;
        }

        .event-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 28px rgba(0, 0, 0, .12);
        }

        .event-card-img {
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            background: linear-gradient(135deg, #0f2d1c, #1a7a4a);
            flex-shrink: 0;
            position: relative;
        }

        .event-card-body {
            padding: 1rem 1.1rem;
        }

        .event-title-txt {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .event-meta-item {
            font-size: 0.8rem;
            color: var(--bs-secondary-color);
            margin-bottom: 3px;
            display: flex;
            align-items: flex-start;
            gap: 6px;
        }

        .event-meta-item i {
            margin-top: 2px;
            flex-shrink: 0;
        }

        .event-price {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--primary-green);
            margin-top: 8px;
        }

        .event-card-footer {
            padding: 0.75rem 1.1rem;
            border-top: 1px solid var(--bs-border-color);
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .artist-chip {
            background: rgba(26, 122, 74, .12);
            color: var(--primary-green);
            border-radius: 99px;
            padding: 2px 10px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        [data-bs-theme="dark"] .artist-chip {
            background: rgba(26, 122, 74, .25);
        }

        .cat-chip {
            background: var(--bs-secondary-bg);
            color: var(--bs-secondary-color);
            border-radius: 99px;
            padding: 2px 10px;
            font-size: 0.72rem;
        }

        .tag-input-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px 10px;
            border: 1px solid var(--bs-border-color);
            border-radius: 8px;
            background: var(--bs-body-bg);
            min-height: 42px;
            align-items: center;
        }

        .tag-input-wrap:focus-within {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 .2rem rgba(26, 122, 74, .15);
        }

        .tag-chip-edit {
            background: rgba(26, 122, 74, .12);
            color: var(--primary-green);
            border-radius: 99px;
            padding: 3px 10px;
            font-size: 0.78rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        [data-bs-theme="dark"] .tag-chip-edit {
            background: rgba(26, 122, 74, .3);
        }

        .tag-chip-edit .rm {
            cursor: pointer;
            font-size: 1rem;
            line-height: 1;
        }

        .tag-chip-edit .rm:hover {
            color: #dc2626;
        }

        #artistInput {
            border: none;
            outline: none;
            background: transparent;
            font-family: 'Inter', sans-serif;
            font-size: 0.88rem;
            flex: 1;
            min-width: 120px;
            color: var(--bs-body-color);
        }

        .cat-row {
            display: grid;
            grid-template-columns: 1fr 130px 100px 36px;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }

        .cat-row .form-control {
            font-size: 0.85rem;
            padding: 6px 10px;
        }

        .cat-add-btn {
            background: none;
            border: 1.5px dashed var(--bs-border-color);
            border-radius: 8px;
            padding: 8px;
            color: var(--bs-secondary-color);
            cursor: pointer;
            width: 100%;
            font-size: 0.85rem;
            transition: all .2s;
            margin-top: 4px;
        }

        .cat-add-btn:hover {
            border-color: var(--primary-green);
            color: var(--primary-green);
        }

        .readonly-field {
            background: var(--bs-tertiary-bg);
            border: 1px solid var(--bs-border-color);
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--bs-secondary-color);
            font-size: 0.88rem;
        }

        @media (max-width: 992px) {
            .sidebar {
                left: -100%;
            }

            .main-content {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="bg-white text-success rounded-2 px-2 py-1" style="font-size:14px;">TT</div>
            <span>TikTakTuk</span>
        </div>
        <ul class="nav-list mt-2" id="sidebarMenu"></ul>
    </aside>

    <div class="main-content">
        <header class="top-bar">
            <div>
                <h6 class="mb-0 fw-bold" id="topBarTitle">Jelajahi Acara</h6>
            </div>
            <div class="d-flex align-items-center gap-4">
                <div class="theme-toggle-btn" onclick="toggleDarkMode()">
                    <i class="bi bi-moon-stars" id="themeIcon"></i>
                </div>
                <div class="dropdown dev-tool-dropdown">
                    <button class="btn btn-sm btn-outline-secondary dropdown-toggle d-flex align-items-center gap-2" data-bs-toggle="dropdown">
                        <i class="bi bi-person-gear"></i><span id="roleLabel">Admin</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
                        <li><h6 class="dropdown-header">Simulasi Role</h6></li>
                        <li><a class="dropdown-item" href="#" onclick="updateRole('admin')"><i class="bi bi-shield-check me-2"></i>Administrator</a></li>
                        <li><a class="dropdown-item" href="#" onclick="updateRole('organizer')"><i class="bi bi-calendar-event me-2"></i>Organizer</a></li>
                        <li><a class="dropdown-item" href="#" onclick="updateRole('customer')"><i class="bi bi-person me-2"></i>Customer</a></li>
                    </ul>
                </div>
            </div>
        </header>

        <div class="p-4">
            <div class="container-fluid">

                <div class="d-flex justify-content-between align-items-start mb-4">
                    <div>
                        <h3 class="fw-bold mb-0" id="pageTitle">Jelajahi Acara</h3>
                        <p class="text-muted small mb-0" id="pageSubtitle">Temukan acara terbaik dan beli tiket favorit Anda</p>
                    </div>
                    <button class="btn btn-success d-none" id="btnBuatAcara" onclick="openCreateEvent()">
                        <i class="bi bi-plus-lg me-1"></i>Buat Acara
                    </button>
                </div>

                <div class="card border shadow-sm mb-4" style="border-radius:12px">
                    <div class="card-body">
                        <div class="row g-2 align-items-center">
                            <div class="col-md-5">
                                <div class="input-group">
                                    <span class="input-group-text bg-transparent border-end-0">
                                        <i class="bi bi-search text-muted"></i>
                                    </span>
                                    <input type="text" class="form-control border-start-0" id="searchEvent" placeholder="Cari acara atau artis..." oninput="filterEvents()" />
                                </div>
                            </div>
                            <div class="col-md-3">
                                <select class="form-select" id="filterVenue" onchange="filterEvents()">
                                    <option value="">Semua Venue</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <select class="form-select" id="filterArtist" onchange="filterEvents()">
                                    <option value="">Semua Artis</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="eventList"></div>

            </div>
        </div>
    </div>

    <!-- Modal Create -->
    <div class="modal fade" id="modalCreateEvent" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold"><i class="bi bi-calendar-plus me-2 text-success"></i>Buat Acara Baru</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">JUDUL ACARA (EVENT_TITLE) <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="c-title" placeholder="cth. Konser Melodi Senja" />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">KATEGORI TIKET (TICKET_CATEGORY) <span class="text-danger">*</span></label>
                            <div id="c-cats"></div>
                            <button type="button" class="cat-add-btn" onclick="addCatRow('c-cats')">
                                <i class="bi bi-plus-circle me-1"></i>Tambah Kategori
                            </button>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold">TANGGAL (DATE) <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="c-date" />
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold">WAKTU (TIME) <span class="text-danger">*</span></label>
                            <input type="time" class="form-control" id="c-time" />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">VENUE (VENUE_ID) <span class="text-danger">*</span></label>
                            <select class="form-select" id="c-venue"></select>
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-semibold">ARTIS (EVENT_ARTIST)</label>
                            <div class="tag-input-wrap" id="c-artist-wrap" onclick="document.getElementById('c-artist-inp').focus()">
                                <input type="text" id="c-artist-inp" placeholder="Ketik nama artis lalu tekan Enter..." onkeydown="addArtistTag(event,'create')" />
                            </div>
                            <div class="form-text">Tekan Enter untuk menambah artis</div>
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-semibold">DESKRIPSI</label>
                            <textarea class="form-control" id="c-desc" rows="2" placeholder="Deskripsi acara..."></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
                    <button class="btn btn-success" onclick="saveCreateEvent()">
                        <i class="bi bi-calendar-check me-1"></i>Buat Acara
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Edit -->
    <div class="modal fade" id="modalEditEvent" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold"><i class="bi bi-pencil-square me-2 text-primary"></i>Edit Acara</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="e-id" />
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">JUDUL ACARA (EVENT_TITLE) <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="e-title" />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">KATEGORI TIKET (TICKET_CATEGORY) <span class="text-danger">*</span></label>
                            <div id="e-cats"></div>
                            <button type="button" class="cat-add-btn" onclick="addCatRow('e-cats')">
                                <i class="bi bi-plus-circle me-1"></i>Tambah Kategori
                            </button>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold">TANGGAL (DATE) <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="e-date" />
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold">WAKTU (TIME) <span class="text-danger">*</span></label>
                            <input type="time" class="form-control" id="e-time" />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">VENUE (VENUE_ID) <span class="text-danger">*</span></label>
                            <select class="form-select" id="e-venue"></select>
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-semibold">ARTIS (EVENT_ARTIST)</label>
                            <div class="tag-input-wrap" id="e-artist-wrap" onclick="document.getElementById('e-artist-inp').focus()">
                                <input type="text" id="e-artist-inp" placeholder="Ketik nama artis lalu tekan Enter..." onkeydown="addArtistTag(event,'edit')" />
                            </div>
                            <div class="form-text">Tekan Enter untuk menambah artis</div>
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-semibold">DESKRIPSI</label>
                            <textarea class="form-control" id="e-desc" rows="2"></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
                    <button class="btn btn-primary" onclick="saveEditEvent()">
                        <i class="bi bi-check2 me-1"></i>Simpan
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999">
        <div id="liveToast" class="toast align-items-center border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body fw-semibold" id="toastMsg"></div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../fitur_wajib/templates/navbar.js"></script>

        let currentRole = localStorage.getItem('role') || 'guest';
        let createArtists = [];

        let catCounter = 0;

        // Timpa updateRole milik navbar.js dengan updateRole lokal khusus Event 
        window.updateRole = function (role) {
            currentRole = role;
            localStorage.setItem('role', role);
            if (typeof renderSidebar === 'function') {
                renderSidebar(role);
            }
            updatePageUI();
            populateFilters();
            filterEvents();
        };

        // PAGE UI (role-based) 
        function updatePageUI() {
            const canManage = currentRole === 'admin' || currentRole === 'organizer';
            document.getElementById('btnBuatAcara').classList.toggle('d-none', !canManage);

            if (currentRole === 'organizer') {
                document.getElementById('pageTitle').textContent = 'Acara Saya';
                document.getElementById('pageSubtitle').textContent = 'Kelola acara yang Anda selenggarakan';
                document.getElementById('topBarTitle').textContent = 'Acara Saya';
            } else if (currentRole === 'admin') {
                document.getElementById('pageTitle').textContent = 'Semua Acara';
                document.getElementById('pageSubtitle').textContent = 'Kelola seluruh acara di platform TikTakTuk';
                document.getElementById('topBarTitle').textContent = 'Semua Acara';
            } else {
                document.getElementById('pageTitle').textContent = 'Jelajahi Acara';
                document.getElementById('pageSubtitle').textContent = 'Temukan acara terbaik dan beli tiket favorit Anda';

            }
        }

        // POPULATE FILTERS 
        function populateFilters() {
            const vf = document.getElementById('filterVenue');
            const vprev = vf.value;
            vf.innerHTML = '<option value="">Semua Venue</option>' +
                venues.map(v => `<option value="${v.id}" ${vprev === v.id ? 'selected' : ''}>${v.name}</option>`).join('');

            const af = document.getElementById('filterArtist');
            const aprev = af.value;
            const allArtists = [...new Set(events.flatMap(e => e.artists))].sort();
            af.innerHTML = '<option value="">Semua Artis</option>' +
                allArtists.map(a => `<option value="${a}" ${aprev === a ? 'selected' : ''}>${a}</option>`).join('');
        }

        // FILTER & RENDER EVENTS 
        function filterEvents() {
            const q = document.getElementById('searchEvent').value.toLowerCase();
            const venId = document.getElementById('filterVenue').value;
            const artist = document.getElementById('filterArtist').value;
            const canManage = currentRole === 'admin' || currentRole === 'organizer';

            let list = events.filter(e => {
                if (currentRole === 'organizer' && e.organizer !== 'organizer') return false;
                const matchQ = !q || e.title.toLowerCase().includes(q) || e.artists.some(a => a.toLowerCase().includes(q));
                const matchV = !venId || e.venueId === venId;
                const matchA = !artist || e.artists.includes(artist);
                return matchQ && matchV && matchA;
            });

            const container = document.getElementById('eventList');
            if (!list.length) {
                container.innerHTML = `<div class="text-center py-5 text-muted">
                    <i class="bi bi-calendar-x" style="font-size:3rem"></i>
                    <p class="mt-2">Tidak ada acara ditemukan</p></div>`;
                return;
            }

            container.innerHTML = `<div class="row g-4">${list.map(e => {
                const v = venues.find(x => x.id === e.venueId);
                const minPrice = Math.min(...e.cats.map(c => c.price));
                const catBadges = e.cats.slice(0, 4).map(c =>
                    `<span class="cat-chip">${c.name}</span>`).join('');

                const favIcon = currentRole === 'customer'
                    ? `<i class="bi bi-heart text-danger" 
                        style="position:absolute; top:12px; right:14px; font-size: 1.2rem; cursor:pointer; z-index:10; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));" 
                        onclick="this.classList.toggle('bi-heart'); this.classList.toggle('bi-heart-fill'); event.stopPropagation();"></i>`
                    : '';

                return `<div class="col-md-6 col-lg-4">
                    <div class="event-card h-100 d-flex flex-column">
                        <div class="event-card-img">
                            ${favIcon}
                            ${e.emoji}
                        </div>
                        <div class="event-card-body flex-grow-1">
                            <div class="d-flex flex-wrap gap-1 mb-2">
                                ${e.artists.map(a => `<span class="artist-chip">${a}</span>`).join('')}
                            </div>
                            <div class="event-title-txt">${e.title}</div>
                            <div class="event-meta-item"><i class="bi bi-calendar3"></i>${e.date} · ${e.time}</div>
                            <div class="event-meta-item"><i class="bi bi-geo-alt"></i>${v ? v.name + ', ' + v.city : '-'}</div>
                            <div class="event-price">Mulai Rp ${minPrice.toLocaleString('id')}</div>
                            <div class="d-flex flex-wrap gap-1 mt-2">${catBadges}</div>
                        </div>
                        <div class="event-card-footer">
                            ${currentRole === 'customer'
                        ? `<button class="btn btn-success btn-sm w-100" onclick="beliTiket('${e.id}')">
                                    <i class="bi bi-ticket-perforated me-1"></i>Beli Tiket
                                </button>`
                        : `<button class="btn btn-outline-primary btn-sm flex-fill" onclick="openEditEvent('${e.id}')">
                                    <i class="bi bi-pencil me-1"></i>Edit Acara
                                </button>
                                <span class="badge bg-success-subtle text-success ms-auto">Aktif</span>`
                    }
                        </div>
                    </div>
                </div>`;
            }).join('')}</div>`;
        }

        // BELI TIKET (Customer) 
        function beliTiket(eventId) {
            window.location.href = '../../fitur_biru/templates/create_order.html';
        }

        // TAG INPUT — ARTIS 
        function addArtistTag(ev, mode) {
            if (ev.key !== 'Enter') return;
            ev.preventDefault();
            const inpId = mode === 'create' ? 'c-artist-inp' : 'e-artist-inp';
            const inp = document.getElementById(inpId);
            const val = inp.value.trim();
            if (!val) return;

            const arr = mode === 'create' ? createArtists : editArtists;
            if (!arr.includes(val)) {
                arr.push(val);
            }
            inp.value = '';
            renderArtistTags(mode);
        }

        function removeArtistTag(mode, idx) {
            const arr = mode === 'create' ? createArtists : editArtists;
            arr.splice(idx, 1);
            renderArtistTags(mode);
        }

        function renderArtistTags(mode) {
            const wrapId = mode === 'create' ? 'c-artist-wrap' : 'e-artist-wrap';
            const inpId = mode === 'create' ? 'c-artist-inp' : 'e-artist-inp';
            const wrap = document.getElementById(wrapId);
            const inp = document.getElementById(inpId);
            const arr = mode === 'create' ? createArtists : editArtists;
            const existingChips = wrap.querySelectorAll('.tag-chip-edit');
            existingChips.forEach(chip => chip.remove());

            arr.forEach((a, i) => {
                const chip = document.createElement('span');
                chip.className = 'tag-chip-edit';
                chip.innerHTML = `${a} <span class="rm" style="cursor:pointer;" onclick="removeArtistTag('${mode}',${i})">×</span>`;
                wrap.insertBefore(chip, inp);
            });
            inp.focus();
        }

        // CATEGORY ROWS 
        function addCatRow(containerId, cat) {
            const c = cat || { name: '', price: '', quota: '' };
            const idx = catCounter++;
            const rowId = `${containerId}-row-${idx}`;
            const row = document.createElement('div');
            row.className = 'cat-row';
            row.id = rowId;
            row.innerHTML = ` 
                <input type="text" class="form-control" placeholder="Nama Kategori" value="${c.name}" id="${containerId}-name-${idx}" /> 
                <input type="number" class="form-control" placeholder="Harga" value="${c.price}" id="${containerId}-price-${idx}" min="0" /> 
                <input type="number" class="form-control" placeholder="Kuota" value="${c.quota}" id="${containerId}-quota-${idx}" min="1" /> 
                <button type="button" class="btn btn-outline-danger btn-sm px-2" onclick="document.getElementById('${rowId}').remove()"> 
                    <i class="bi bi-x-lg"></i> 
                </button>`;
            document.getElementById(containerId).appendChild(row);
        }

        function collectCats(containerId) {
            const rows = document.querySelectorAll(`#${containerId} .cat-row`);
            const cats = [];
            let err = false;
            rows.forEach(row => {
                const rid = row.id.replace(`${containerId}-row-`, '');
                const name = document.getElementById(`${containerId}-name-${rid}`).value.trim();
                const price = parseFloat(document.getElementById(`${containerId}-price-${rid}`).value);
                const quota = parseInt(document.getElementById(`${containerId}-quota-${rid}`).value);
                if (!name || isNaN(price) || price < 0 || isNaN(quota) || quota <= 0) { err = true; return; }
                cats.push({ name, price, quota });
            });
            return err ? null : cats;
        }

        // POPULATE VENUE SELECT IN MODAL 
        function populateVenueSelect(selectId, selectedVenueId) {
            document.getElementById(selectId).innerHTML =
                venues.map(v => `<option value="${v.id}" ${v.id === selectedVenueId ? 'selected' : ''}>${v.name} (${v.city})</option>`).join('');
        }

        // CREATE EVENT 
        function openCreateEvent() {
            createArtists = [];
            catCounter = 0;
            ['c-title', 'c-desc'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('c-date').value = '';
            document.getElementById('c-time').value = '';
            document.getElementById('c-cats').innerHTML = '';
            renderArtistTags('create');
            populateVenueSelect('c-venue', '');
            addCatRow('c-cats');
            new bootstrap.Modal(document.getElementById('modalCreateEvent')).show();
        }

        function saveCreateEvent() {
            const title = document.getElementById('c-title').value.trim();
            const date = document.getElementById('c-date').value;
            const time = document.getElementById('c-time').value;
            const venId = document.getElementById('c-venue').value;
            const desc = document.getElementById('c-desc').value.trim();
            const cats = collectCats('c-cats');

            const pendingArtist = document.getElementById('c-artist-inp').value.trim();
            if (pendingArtist && !createArtists.includes(pendingArtist)) {
                createArtists.push(pendingArtist);
            }

            if (!title || !date || !time || !venId) { showToast('Judul, tanggal, waktu, dan venue wajib diisi!', 'danger'); return; }
            if (!cats || !cats.length) { showToast('Lengkapi semua data kategori tiket!', 'danger'); return; }

            const v = venues.find(x => x.id === venId);
            const totalQ = cats.reduce((a, c) => a + c.quota, 0);
            if (v && totalQ > v.capacity) {
                showToast(`Total kuota tiket (${totalQ}) melebihi kapasitas venue (${v.capacity})!`, 'danger'); return;
            }

            const emojis = ['🎵', '🎸', '🎺', '🎷', '🎹', '🎤', '🎭', '🌟', '🔥', '✨'];
            events.push({
                id: 'e' + Date.now(),
                organizer: currentRole === 'organizer' ? 'organizer' : 'admin',
                title, date, time, venueId: venId, artists: [...createArtists], cats, desc,
                emoji: emojis[Math.floor(Math.random() * emojis.length)],
            });

            bootstrap.Modal.getInstance(document.getElementById('modalCreateEvent')).hide();
            populateFilters();
            filterEvents();
            showToast('Acara berhasil dibuat!', 'success');
        }

        // EDIT EVENT 
        function openEditEvent(id) {
            const e = events.find(x => x.id === id);
            if (!e) return;

            editArtists = [...e.artists];
            catCounter = 0;

            document.getElementById('e-id').value = e.id;
            document.getElementById('e-title').value = e.title;
            document.getElementById('e-date').value = e.date;
            document.getElementById('e-time').value = e.time;
            document.getElementById('e-desc').value = e.desc || '';
            document.getElementById('e-cats').innerHTML = '';

            populateVenueSelect('e-venue', e.venueId);
            e.cats.forEach(c => addCatRow('e-cats', c));
            renderArtistTags('edit');

            new bootstrap.Modal(document.getElementById('modalEditEvent')).show();
        }

        function saveEditEvent() {
            const id = document.getElementById('e-id').value;
            const title = document.getElementById('e-title').value.trim();
            const date = document.getElementById('e-date').value;
            const time = document.getElementById('e-time').value;
            const venId = document.getElementById('e-venue').value;
            const desc = document.getElementById('e-desc').value.trim();
            const cats = collectCats('e-cats');

            const pendingArtist = document.getElementById('e-artist-inp').value.trim();
            if (pendingArtist && !editArtists.includes(pendingArtist)) {
                editArtists.push(pendingArtist);
            }

            if (!title || !date || !time || !venId) { showToast('Judul, tanggal, waktu, dan venue wajib diisi!', 'danger'); return; }
            if (!cats || !cats.length) { showToast('Lengkapi semua data kategori tiket!', 'danger'); return; }

            const v = venues.find(x => x.id === venId);
            const totalQ = cats.reduce((a, c) => a + c.quota, 0);
            if (v && totalQ > v.capacity) {
                showToast(`Total kuota tiket (${totalQ}) melebihi kapasitas venue (${v.capacity})!`, 'danger'); return;
            }

            const idx = events.findIndex(e => e.id === id);
            events[idx] = { ...events[idx], title, date, time, venueId: venId, artists: [...editArtists], cats, desc };

            bootstrap.Modal.getInstance(document.getElementById('modalEditEvent')).hide();
            populateFilters();
            filterEvents();
            showToast('Acara berhasil diperbarui!', 'success');
        }

        // TOAST 
        function showToast(msg, type = 'success') {
            const el = document.getElementById('liveToast');
            el.className = `toast align-items-center border-0 text-bg-${type}`;
            document.getElementById('toastMsg').textContent = msg;
            new bootstrap.Toast(el, { delay: 3500 }).show();
        }

        // INIT LOKAL 
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                updatePageUI();
                populateFilters();
                filterEvents();
                document.querySelectorAll('.nav-link-custom').forEach(link => {
                    const text = link.textContent.trim().toLowerCase();
                    if (text.includes('event')) {
                        link.classList.add('active');
                    }
                });
            }, 100);
        });
    </script>
</body>
</html>
