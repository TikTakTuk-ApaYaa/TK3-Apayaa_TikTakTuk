<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Pelanggan - TikTakTuk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { 
      background: #e9f1ff; 
      font-family: 'Inter', sans-serif; 
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 40px 0;
    }
    .main-card { 
      width: 100%;
      max-width: 480px; 
      border-radius: 20px; 
      border: none; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      margin: auto;
    }
    .logo-box {
      background-color: #2b59ff;
      color: white;
      width: 45px;
      height: 45px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      font-weight: bold;
      font-size: 1.2rem;
    }
    .form-label { font-size: 0.9rem; font-weight: 600; margin-bottom: 5px; }
    .form-control { border-radius: 8px; padding: 10px 15px; border: 1px solid #dee2e6; }
    .btn-dark { background-color: #1a1a1a; border: none; padding: 12px; border-radius: 10px; font-weight: bold; color: white; transition: 0.3s; }
    .btn-dark:hover { background-color: #333; }
    .back-link { color: #2b59ff; text-decoration: none; font-size: 0.85rem; font-weight: 600; }
    .error-message { color: #dc3545; font-size: 0.75rem; margin-top: 5px; display: none; }
  </style>
</head>
<body>

  <div class="container d-flex justify-content-center">
    <div class="card main-card p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="logo-box">TT</div>
        <h3 class="fw-bold mb-1">TikTakTuk</h3>
        <p class="text-muted small">Daftar untuk Memulai</p>
      </div>

      <div class="text-center mb-4">
        <a href="{% url 'fitur_wajib:pilih_role' %}" class="back-link">← Kembali</a>
      </div>

      <h5 class="fw-bold mb-1">Daftar sebagai Pelanggan</h5>
      <p class="text-muted small mb-4">Buat akun baru untuk memulai pengalaman Anda</p>

      {% if error %}
      <div class="alert alert-danger small py-2" role="alert">
        {{ error }}
      </div>
      {% endif %}

      <form id="registerForm" method="POST" onsubmit="return validateForm()">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Nama Lengkap</label>
          <input type="text" name="full_name" class="form-control" placeholder="Masukkan nama lengkap" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Nomor Telepon</label>
          <input type="tel" name="phone_number" class="form-control" pattern="[0-9]+" title="Hanya masukkan angka" placeholder="Contoh: 0812345678" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" placeholder="Pilih username" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Minimal 6 karakter" required minlength="6">
        </div>

        <div class="mb-3">
          <label class="form-label">Konfirmasi Password</label>
          <input type="password" id="confirm_password" class="form-control" placeholder="Konfirmasi password" required minlength="6">
          <div id="passwordError" class="error-message">Password dan Konfirmasi Password tidak cocok!</div>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="terms" required>
          <label class="form-check-label small text-muted" for="terms">
            Saya setuju dengan <a href="#" class="text-decoration-none">Syarat & Ketentuan</a>
          </label>
        </div>

        <button type="submit" class="btn btn-dark w-100">Daftar</button>
      </form>

      <div class="text-center mt-4">
        <p class="small text-muted">Sudah punya akun? <a href="{% url 'fitur_wajib:login' %}" class="text-primary text-decoration-none fw-bold">Login di sini</a></p>
      </div>
    </div>
  </div>

  <script>
    function validateForm() {
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm_password").value;
      const errorDiv = document.getElementById("passwordError");

      if (password !== confirmPassword) {
        errorDiv.style.display = "block";
        document.getElementById("confirm_password").classList.add("is-invalid");
        return false; 
      } else {
        errorDiv.style.display = "none";
        document.getElementById("confirm_password").classList.remove("is-invalid");
        return true; 
      }
    }
  </script>

</body>
</html>
