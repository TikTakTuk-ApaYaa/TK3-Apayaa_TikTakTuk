<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TikTakTuk - Navbar</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  
  <style>
    :root {
      --sidebar-width: 260px;
      --primary-green: #1a7a4a;
      --transition-speed: 0.3s;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bs-body-bg);
      transition: background-color var(--transition-speed), color var(--transition-speed);
    }

    .sidebar {
      width: var(--sidebar-width);
      height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
      background: #111827;
      color: white;
      transition: all var(--transition-speed);
      z-index: 1000;
      border-right: 1px solid rgba(255,255,255,0.1);
      overflow-y: auto;
    }

    [data-bs-theme="dark"] .sidebar {
      background: #000;
    }

    .sidebar-header {
      padding: 1.5rem;
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--primary-green);
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .nav-list {
      list-style: none;
      padding: 1rem;
      margin: 0;
    }

    .nav-item-custom {
      margin-bottom: 4px;
    }

    .nav-link-custom {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0.75rem 1rem;
      color: #9ca3af;
      text-decoration: none;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .nav-link-custom:hover {
      background: rgba(255,255,255,0.05);
      color: white;
    }

    .nav-link-custom.active {
      background: var(--primary-green);
      color: white;
    }

    .nav-link-custom.logout-link {
      color: #f87171;
    }

    .nav-link-custom.logout-link:hover {
      background: rgba(248,113,113,0.1);
      color: #f87171;
    }

    .main-content {
      margin-left: var(--sidebar-width);
      padding: 0;
      min-height: 100vh;
    }

    .top-bar {
      height: 70px;
      background: var(--bs-body-bg);
      border-bottom: 1px solid var(--bs-border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      position: sticky;
      top: 0;
      z-index: 999;
    }

    .dev-tool-dropdown .dropdown-toggle::after { display: none; }

    .theme-toggle-btn {
      cursor: pointer;
      font-size: 1.2rem;
      color: var(--bs-secondary-color);
      transition: color 0.2s;
    }

    .theme-toggle-btn:hover {
      color: var(--primary-green);
    }

    @media (max-width: 992px) {
      .sidebar { left: -100%; }
      .main-content { margin-left: 0; }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="bg-white text-success rounded-2 px-2 py-1" style="font-size:14px;">TT</div>
      <span>TikTakTuk</span>
    </div>
    <ul class="nav-list" id="sidebarMenu"></ul>
  </aside>

  <div class="main-content">

    <header class="top-bar">
      <div>
        <h6 class="mb-0 fw-bold" id="currentSectionTitle">Dashboard</h6>
      </div>

      <div class="d-flex align-items-center gap-3">

        <div class="theme-toggle-btn" onclick="toggleDarkMode()">
          <i id="themeIcon" class="bi bi-moon-stars"></i>
        </div>

        <div class="dropdown dev-tool-dropdown">
          <button class="btn btn-sm btn-outline-secondary dropdown-toggle d-flex align-items-center gap-2"
                  data-bs-toggle="dropdown">
            <i class="bi bi-eye"></i>
            <span id="roleLabel">Guest</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
            <li><h6 class="dropdown-header">Switch Role</h6></li>
            <li><a class="dropdown-item" href="#" onclick="updateRole('admin')">
              <i class="bi bi-shield-check me-2"></i>Administrator
            </a></li>
            <li><a class="dropdown-item" href="#" onclick="updateRole('organizer')">
              <i class="bi bi-calendar-event me-2"></i>Event Organizer
            </a></li>
            <li><a class="dropdown-item" href="#" onclick="updateRole('customer')">
              <i class="bi bi-person me-2"></i>Customer
            </a></li>
          </ul>
        </div>

      </div>
    </header>

    <div class="p-4">
      <div class="container-fluid">
        <div class="row g-4">
          <div class="col-12">
            <div class="card border-0 shadow-sm p-5 text-center">
              <h2 class="fw-bold">Welcome to TikTakTuk</h2>
              <p class="text-muted">Platform Manajemen Pertunjukan & Tiket</p>
              <p class="text-muted small">Pilih role di pojok kanan atas untuk melihat perubahan menu sidebar sesuai spesifikasi tugas.</p>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>

    // MENU 
    const ROLE_MENUS = {

guest: [
        { label: 'Login',      icon: 'bi-box-arrow-in-right', href: 'login.html' },
        { label: 'Registrasi', icon: 'bi-person-plus',        href: 'Cpengguna_pilihRole.html' },
        { label: 'Promo',      icon: 'bi-megaphone',         href: 'read_promo_guest.html' } 
      ],

      admin: [
        { label: 'Dashboard',       icon: 'bi-grid-1x2',          href: '/fitur_wajib/templates/dashboard.html' },
        { label: 'Manajemen Venue', icon: 'bi-building',           href: '/fitur_kuning/templates/venue.html' },
        { label: 'Manajemen Kursi', icon: 'bi-grid-3x3',           href: '/admin/seats/' },
        { label: 'Kategori Tiket',  icon: 'bi-tags',               href: '/fitur_hijau/templates/ticket_category_list.html' },
        { label: 'Manajemen Tiket', icon: 'bi-ticket-perforated',  href: '/admin/tickets/' },
        { label: 'Semua Order',     icon: 'bi-cart-check',         href: '/fitur_biru/templates/read_order_admin.html' },
        { label: 'Manajemen Promo', icon: 'bi-patch-check',       href: '/fitur_biru/templates/CRUD_promo_admin.html' }, // Fitur Biru
        { label: 'Tiket (Aset)',    icon: 'bi-collection',         href: '/admin/asset-tickets/' },
        { label: 'Order (Aset)',    icon: 'bi-receipt',            href: '/admin/asset-orders/' },
        { label: 'Profile',         icon: 'bi-person-circle',      href: '/admin/profile/' },
      ],

      organizer: [
        { label: 'Dashboard',       icon: 'bi-grid-1x2',          href: '/fitur_wajib/templates/dashboard.html' },
        { label: 'Event Saya',      icon: 'bi-calendar-event',    href: '/fitur_kuning/templates/event.html' },
        { label: 'Manajemen Venue', icon: 'bi-building',           href: '/fitur_kuning/templates/venue.html' },
        { label: 'Manajemen Kursi', icon: 'bi-grid-3x3',           href: '/organizer/seats/' },
        { label: 'Kategori Tiket',  icon: 'bi-tags',               href: '/fitur_hijau/templates/ticket_category_list.html'},
        { label: 'Manajemen Tiket', icon: 'bi-ticket-perforated',  href: '/organizer/tickets/' },
        { label: 'Semua Order',     icon: 'bi-cart-check',         href: '/fitur_biru/templates/read_order_organizer.html' },
        { label: 'Daftar Promo',    icon: 'bi-megaphone',         href: '/fitur_biru/templates/read_promo_organizer.html' },
        { label: 'Tiket (Aset)',    icon: 'bi-collection',         href: '/organizer/asset-tickets/' },
        { label: 'Order (Aset)',    icon: 'bi-receipt',            href: '/organizer/asset-orders/' },
        { label: 'Profile',         icon: 'bi-person-circle',      href: '/organizer/profile/' },
      ],

      customer: [
        { label: 'Dashboard',  icon: 'bi-grid-1x2',          href: '/fitur_wajib/templates/dashboard.html' },
        { label: 'Tiket Saya', icon: 'bi-ticket',            href: '/customer/tickets/' },
        { label: 'Pesanan',    icon: 'bi-bag-check',         href: '/fitur_biru/templates/read_order_cust.html' },
        { label: 'Cari Event', icon: 'bi-search',            href: '/fitur_kuning/templates/event.html' },
        { label: 'Promosi',    icon: 'bi-megaphone',         href: '/fitur_biru/templates/read_promo_cust.html' },
        { label: 'Beli Tiket',   icon: 'bi-cart-plus',       href: '/fitur_biru/templates/create_order.html' },    // Fitur Biru
        { label: 'Venue',      icon: 'bi-geo-alt',           href: '/fitur_kuning/templates/venue.html' },
        { label: 'Artis',      icon: 'bi-people',            href: '/fitur_hijau/templates/artist_list.html' },
        { label: 'Logout',     icon: 'bi-box-arrow-right',   href: '#', isLogout: true },
      ]

    };

    const ROLE_DISPLAY_NAMES = {
      admin:     'Administrator',
      organizer: 'Event Organizer',
      customer:  'Customer',
      guest:     'Guest'
    };

    // RENDER SIDEBAR
    function renderSidebar(role) {
      const menuContainer = document.getElementById('sidebarMenu');
      const roleLabel     = document.getElementById('roleLabel');

      const items = ROLE_MENUS[role] || ROLE_MENUS.guest;
      const safeRole = ROLE_MENUS[role] ? role : 'guest';

      if (roleLabel) {
        roleLabel.innerText = ROLE_DISPLAY_NAMES[safeRole];
      }

      menuContainer.innerHTML = '';
      items.forEach(item => {
        const li = document.createElement('li');
        li.className = 'nav-item-custom';
        
        const onClickHandler = item.isLogout ? 'onclick="simulateLogout(event)"' : '';

        li.innerHTML = `
          <a href="${item.href}" class="nav-link-custom ${item.isLogout ? 'logout-link' : ''}" ${onClickHandler}>
            <i class="bi ${item.icon}"></i>
            <span>${item.label}</span>
          </a>`;
        menuContainer.appendChild(li);
      });
    }

    // UPDATE ROLE & LOGOUT SIMULATION
    function updateRole(newRole) {
      localStorage.setItem('role', newRole);
      renderSidebar(newRole);
    }

    function simulateLogout(event) {
      event.preventDefault();
      localStorage.removeItem('role'); 
      renderSidebar('guest'); // Otomatis kembali ke tampilan Guest
    }

    // DARK MODE
    function toggleDarkMode() {
      const html = document.documentElement;
      const icon = document.getElementById('themeIcon');
      const isDark = html.getAttribute('data-bs-theme') === 'dark';
      html.setAttribute('data-bs-theme', isDark ? 'light' : 'dark');
      icon.className = isDark ? 'bi bi-moon-stars' : 'bi bi-sun';
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
    }

    // INIT
    const savedRole  = localStorage.getItem('role')  || 'guest';
    const savedTheme = localStorage.getItem('theme') || 'light';

    document.documentElement.setAttribute('data-bs-theme', savedTheme);
    document.getElementById('themeIcon').className = savedTheme === 'dark' ? 'bi bi-sun' : 'bi bi-moon-stars';

    renderSidebar(savedRole);

  </script>
</body>
</html>
