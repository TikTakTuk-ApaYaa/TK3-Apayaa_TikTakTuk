<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TikTakTuk - Professional Dashboard</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  
  <style>
    :root {
      --sidebar-width: 260px;
      --primary-green: #1a7a4a;
      --transition-speed: 0.3s;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bs-body-bg);
      transition: background-color var(--transition-speed), color var(--transition-speed);
    }

    /* Sidebar Styling */
    .sidebar {
      width: var(--sidebar-width);
      height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
      background: #111827; /* Dark Slate for Contrast */
      color: white;
      transition: all var(--transition-speed);
      z-index: 1000;
      border-right: 1px solid rgba(255,255,255,0.1);
    }

    [data-bs-theme="dark"] .sidebar {
      background: #000;
    }

    .sidebar-header {
      padding: 1.5rem;
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--primary-green);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-list {
      list-style: none;
      padding: 0 1rem;
    }

    .nav-item-custom {
      margin-bottom: 5px;
    }

    .nav-link-custom {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0.8rem 1rem;
      color: #9ca3af;
      text-decoration: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .nav-link-custom:hover {
      background: rgba(255,255,255,0.05);
      color: white;
    }

    .nav-link-custom.active {
      background: var(--primary-green);
      color: white;
    }

    /* Main Content Area */
    .main-content {
      margin-left: var(--sidebar-width);
      padding: 0;
      min-height: 100vh;
    }

    /* Top Bar */
    .top-bar {
      height: 70px;
      background: var(--bs-body-bg);
      border-bottom: 1px solid var(--bs-border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      position: sticky;
      top: 0;
      z-index: 999;
    }

    /* Role Simulation / Dev Tool Menu */
    .dev-tool-dropdown .dropdown-toggle::after { display: none; }
    
    .theme-toggle-btn {
      cursor: pointer;
      font-size: 1.2rem;
      color: var(--bs-secondary-color);
    }

    /* Responsive */
    @media (max-width: 992px) {
      .sidebar { left: -100%; }
      .main-content { margin-left: 0; }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="bg-white text-success rounded-2 px-2 py-1" style="font-size: 14px;">TT</div>
      <span>TikTakTuk</span>
    </div>
    <ul class="nav-list" id="sidebarMenu">
      </ul>
  </aside>

  <div class="main-content">
    <header class="top-bar">
      <div>
        <h6 class="mb-0 fw-bold" id="currentSectionTitle">Dashboard Overview</h6>
      </div>
      
      <div class="d-flex align-items-center gap-4">
        <div class="theme-toggle-btn" id="themeToggle" onclick="toggleDarkMode()">
          <i class="bi bi-moon-stars" id="themeIcon"></i>
        </div>

        <div class="dropdown dev-tool-dropdown">
          <button class="btn btn-sm btn-outline-secondary dropdown-toggle d-flex align-items-center gap-2" data-bs-toggle="dropdown">
            <i class="bi bi-person-gear"></i>
            <span id="roleLabel">Guest</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
            <li><h6 class="dropdown-header">Simulate User Role</h6></li>
            <li><a class="dropdown-item" href="#" onclick="updateRole('guest')">Guest (Public)</a></li>
            <li><a class="dropdown-item" href="#" onclick="updateRole('admin')">Administrator</a></li>
            <li><a class="dropdown-item" href="#" onclick="updateRole('organizer')">Event Organizer</a></li>
            <li><a class="dropdown-item" href="#" onclick="updateRole('customer')">Customer</a></li>
          </ul>
        </div>

        <div class="d-flex align-items-center gap-2">
          <div class="rounded-circle bg-success text-white d-flex align-items-center justify-content-center" style="width: 35px; height: 35px; font-size: 12px; font-weight: bold;">
            Q
          </div>
        </div>
      </div>
    </header>

    <div class="p-4">
      <div class="container-fluid">
        <div class="row g-4" id="contentGrid">
          <div class="col-12">
            <div class="card border-0 shadow-sm p-5 text-center">
              <h2 class="fw-bold">Welcome to TikTakTuk</h2>
              <p class="text-muted">Pilih role di pojok kanan atas untuk melihat perubahan menu sidebar sesuai skenario tugas.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // MENU SESUAI SKENARIO 
    const ROLE_MENUS = {
      guest: [
        { label: 'Login', icon: 'bi-box-arrow-in-right', href: '/login/' },
        { label: 'Registrasi', icon: 'bi-person-plus', href: '/register/' }
      ],
      admin: [
        { label: 'Dashboard', icon: 'bi-grid-1x2', href: '/admin/dashboard/' },
        { label: 'Manajemen Venue', icon: 'bi-building', href: '/admin/venue/' },
        { label: 'Manajemen Kursi', icon: 'bi-grid-3x3', href: '/admin/seats/' },
        { label: 'Kategori Tiket', icon: 'bi-tags', href: '/admin/ticket-category/' },
        { label: 'Manajemen Tiket', icon: 'bi-ticket-perforated', href: '/admin/tickets/' },
        { label: 'Semua Order', icon: 'bi-cart-check', href: '/admin/orders/' },
        { label: 'Tiket (Aset)', icon: 'bi-collection', href: '/admin/asset-tickets/' },
        { label: 'Order (Aset)', icon: 'bi-receipt', href: '/admin/asset-orders/' },
        { label: 'Profile', icon: 'bi-person-circle', href: '/admin/profile/' }
      ],
      organizer: [
        { label: 'Dashboard', icon: 'bi-grid-1x2', href: '/organizer/dashboard/' },
        { label: 'Event Saya', icon: 'bi-calendar-event', href: '/organizer/events/' },
        { label: 'Manajemen Venue', icon: 'bi-building', href: '/organizer/venue/' },
        { label: 'Manajemen Kursi', icon: 'bi-grid-3x3', href: '/organizer/seats/' },
        { label: 'Kategori Tiket', icon: 'bi-tags', href: '/organizer/ticket-category/' },
        { label: 'Manajemen Tiket', icon: 'bi-ticket-perforated', href: '/organizer/tickets/' },
        { label: 'Semua Order', icon: 'bi-cart-check', href: '/organizer/orders/' },
        { label: 'Tiket (Aset)', icon: 'bi-collection', href: '/organizer/asset-tickets/' },
        { label: 'Order (Aset)', icon: 'bi-receipt', href: '/organizer/asset-orders/' },
        { label: 'Profile', icon: 'bi-person-circle', href: '/organizer/profile/' }
      ],
      customer: [
        { label: 'Dashboard', icon: 'bi-grid-1x2', href: '/customer/dashboard/' },
        { label: 'Tiket Saya', icon: 'bi-ticket', href: '/customer/tickets/' },
        { label: 'Pesanan', icon: 'bi-bag-check', href: '/customer/orders/' },
        { label: 'Cari Event', icon: 'bi-search', href: '/customer/search/' },
        { label: 'Promosi', icon: 'bi-megaphone', href: '/customer/promotions/' },
        { label: 'Venue', icon: 'bi-geo-alt', href: '/customer/venues/' },
        { label: 'Artis', icon: 'bi-people', href: '/fitur_hijau/artist/' },
        { label: 'Logout', icon: 'bi-box-arrow-right', href: '/logout/', isLogout: true }
      ]
    };

    function renderSidebar(role) {
      const menuContainer = document.getElementById('sidebarMenu');
      const roleLabel = document.getElementById('roleLabel');
      const items = ROLE_MENUS[role] || ROLE_MENUS.guest;

      roleLabel.innerText = role.charAt(0).toUpperCase() + role.slice(1);
      menuContainer.innerHTML = '';

      items.forEach(item => {
        const li = document.createElement('li');
        li.className = 'nav-item-custom';
        li.innerHTML = `
          <a href="${item.href}" class="nav-link-custom ${item.isLogout ? 'text-warning' : ''}">
            <i class="bi ${item.icon}"></i>
            <span>${item.label}</span>
          </a>
        `;
        menuContainer.appendChild(li);
      });
    }

    function updateRole(newRole) {
      localStorage.setItem('role', newRole);
      renderSidebar(newRole);
    }

    // DARK MODE LOGIC
    function toggleDarkMode() {
      const html = document.documentElement;
      const icon = document.getElementById('themeIcon');
      
      if (html.getAttribute('data-bs-theme') === 'light') {
        html.setAttribute('data-bs-theme', 'dark');
        icon.className = 'bi bi-sun';
        localStorage.setItem('theme', 'dark');
      } else {
        html.setAttribute('data-bs-theme', 'light');
        icon.className = 'bi bi-moon-stars';
        localStorage.setItem('theme', 'light');
      }
    }

    // INIT
    const savedRole = localStorage.getItem('role') || 'guest';
    const savedTheme = localStorage.getItem('theme') || 'light';
    
    document.documentElement.setAttribute('data-bs-theme', savedTheme);
    document.getElementById('themeIcon').className = savedTheme === 'dark' ? 'bi bi-sun' : 'bi bi-moon-stars';
    
    renderSidebar(savedRole);
  </script>
</body>
</html>
