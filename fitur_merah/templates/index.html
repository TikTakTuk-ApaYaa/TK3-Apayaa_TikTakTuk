<!DOCTYPE html>
<html>
<head>
    <title>TikTakTuk - Fitur Merah</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8 font-sans">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <div class="bg-white p-6 rounded-lg shadow">
                <h2 class="text-xl font-semibold text-gray-900 mb-4">Ticket Management</h2>

            <div class="grid grid-cols-2 md:grid-cols-3 gap-4">

                <a href="create-ticket-modal.html" class="bg-gray-100 p-3 rounded text-center hover:bg-gray-200">Create Ticket Modal</a>
                <a href="update-ticket-modal.html" class="bg-gray-100 p-3 rounded text-center hover:bg-gray-200">Update Ticket Modal</a>
                <a href="delete-ticket-modal.html" class="bg-gray-100 p-3 rounded text-center hover:bg-gray-200">Delete Ticket Modal</a>
            </div>
        </div>

</html>
