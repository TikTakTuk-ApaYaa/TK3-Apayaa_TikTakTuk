<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tambah Kursi</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: rgba(0, 0, 0, 0.35);
      color: #111827;
    }
    .modal {
      width: 560px;
      background: #fff;
      border-radius: 18px;
      padding: 28px 30px 30px;
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.18);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 26px;
    }
    .modal-title {
      margin: 0;
      font-size: 23px;
      font-weight: 800;
    }
    .close {
      border: 0;
      background: transparent;
      color: #9ca3af;
      font-size: 34px;
      line-height: 1;
      cursor: pointer;
    }
    .form-group { margin-bottom: 18px; }
    label {
      display: block;
      margin-bottom: 9px;
      color: #8b94a5;
      font-size: 15px;
      font-weight: 800;
      text-transform: uppercase;
    }
    input, select {
      width: 100%;
      height: 50px;
      padding: 0 18px;
      border: 1px solid #e5e7eb;
      border-radius: 15px;
      background: #fff;
      color: #1f2937;
      font-size: 17px;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #bfdbfe;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 30px;
    }
    .btn {
      height: 46px;
      border-radius: 14px;
      border: 1px solid #e5e7eb;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-cancel { background: #fff; color: #2b2f36; }
    .btn-primary { background: #315cf6; color: #fff; border-color: #315cf6; }
  </style>
</head>
<body>
  <div class="modal">
    <div class="modal-header">
      <h1 class="modal-title">Tambah Kursi Baru</h1>
      <button type="button" class="close" aria-label="Tutup">&times;</button>
    </div>

    <form method="post">
      {% csrf_token %}

      <div class="form-group">
        <label for="venue">Venue</label>
        <select id="venue" name="venue_id" required>
          <option value="">Pilih venue</option>
          {% for venue in venues %}
          <option value="{{ venue.venue_id }}">{{ venue.venue_name }} — {{ venue.city }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="section">Section</label>
        <input id="section" name="section" type="text" placeholder="Contoh: WVIP, VIP, Tribune West" required />
      </div>

      <div class="form-group">
        <label for="row_number">Baris</label>
        <input id="row_number" name="row_number" type="text" placeholder="Contoh: A, B, C, 1, 2, 3" required />
      </div>

      <div class="form-group">
        <label for="seat_number">No. Kursi</label>
        <input id="seat_number" name="seat_number" type="text" placeholder="Contoh: 1, 2, 3" required />
      </div>

      <div class="actions">
        <button type="button" class="btn btn-cancel">Batal</button>
        <button type="submit" class="btn btn-primary">Tambah</button>
      </div>
    </form>
  </div>
</body>
</html>
