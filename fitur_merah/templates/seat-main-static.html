<!DOCTYPE html>
<html>
<head>
    <title>Seats</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 p-8 font-sans">
<div class="max-w-7xl mx-auto">

    <!-- TITLE -->
    <div class="flex justify-between items-center mb-6">
        <div>
            <h2 class="text-2xl font-bold text-gray-900">
                Manajemen Kursi
            </h2>
            <div class="text-gray-600 mt-1">
                Kelola kursi: tambah, ubah, dan hapus kursi
            </div>
        </div>

        <a href="#" class="bg-blue-600 text-white px-4 py-2 rounded-lg no-underline hover:bg-blue-700">+ Tambah Kursi</a>
    </div>

    <!-- STATS -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
        <div class="bg-white p-6 rounded-lg shadow">
            <div class="text-sm font-medium text-gray-500">TOTAL KURSI</div>
            <div class="text-2xl font-bold text-gray-900">36</div>
        </div>
        <div class="bg-white p-6 rounded-lg shadow">
            <div class="text-sm font-medium text-gray-500">TERSEDIA</div>
            <div class="text-2xl font-bold text-gray-900">24</div>
        </div>
        <div class="bg-white p-6 rounded-lg shadow">
            <div class="text-sm font-medium text-gray-500">TERISI</div>
            <div class="text-2xl font-bold text-gray-900">12</div>
        </div>
    </div>

    <!-- FILTER -->
    <div class="flex gap-4 mb-6">
        <input type="text" placeholder="Cari nama venue atau nomor kursi..." class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
        <select class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            <option>Semua Venue</option>
            <option>Stadion Gelora Bung Karno</option>
            <option>Jakarta Convention Center</option>
        </select>
        <select class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            <option>Semua Status</option>
            <option>Tersedia</option>
            <option>Terisi</option>
        </select>
    </div>

    <!-- SEATS TABLE -->
    <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="w-full">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Venue</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Seksi</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Baris</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nomor</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Aksi</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                <tr>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">Stadion Gelora Bung Karno</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">VIP</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">A</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">1</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="inline-flex px-2 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-800">Tersedia</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <button class="text-blue-600 hover:text-blue-900 mr-3">Update</button>
                        <button class="text-red-600 hover:text-red-900">Hapus</button>
                    </td>
                </tr>
                <tr>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">Stadion Gelora Bung Karno</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">VIP</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">A</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">2</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="inline-flex px-2 py-1 text-xs font-semibold rounded-full bg-red-100 text-red-800">Terisi</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <button class="text-blue-600 hover:text-blue-900 mr-3">Update</button>
                        <button class="text-red-600 hover:text-red-900">Hapus</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
