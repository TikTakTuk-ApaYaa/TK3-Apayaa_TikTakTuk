<!DOCTYPE html>
<html>
<head>
    <title>Create Ticket</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: rgba(0,0,0,0.3);
        }

        .modal {
            width: 420px;
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin: 100px auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .modal-header h3 {
            margin: 0;
        }

        .close {
            cursor: pointer;
            font-size: 20px;
        }

        .field {
            margin-bottom: 15px;
        }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #666;
        }

        .field select, .field input {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .readonly {
            background: #f5f5f5;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
        }

        .btn-cancel {
            background: #eee;
        }

        .btn-primary {
            background: #3b5bdb;
            color: white;
        }
    </style>
</head>

<body>

<div class="modal">
    
    <div class="modal-header">
        <h3>Tambah Tiket Baru</h3>
        <span class="close">×</span>
    </div>

    <form method="POST">
        {% csrf_token %}

        <!-- ORDER -->
        <div class="field">
            <label>ORDER</label>
            <select name="order_id" required>
                {% for order in orders %}
                <option value="{{ order.id }}">
                    {{ order.id }} — {{ order.customer_name }} — {{ order.event_name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <!-- CATEGORY -->
        <div class="field">
            <label>KATEGORI TIKET</label>
            <select name="category_id" required>
                {% for cat in categories %}
                <option value="{{ cat.id }}">
                    {{ cat.name }} — {{ cat.price }} ({{ cat.used }}/{{ cat.quota }})
                </option>
                {% endfor %}
            </select>
        </div>

        <!-- SEAT (OPTIONAL) -->
        <div class="field" id="seat-field" style="display: {{ show_seat|yesno:'block,none' }}">
            <label>KURSI (opsional)</label>
            <select name="seat_id">
                <option value="">Pilih Kursi</option>
                {% for seat in seats %}
                <option value="{{ seat.id }}">
                    {{ seat.section }} — Baris {{ seat.row }}, No. {{ seat.number }}
                </option>
                {% endfor %}
            </select>
        </div>

        <!-- TICKET CODE -->
        <div class="field">
            <label>KODE TIKET</label>
            <input type="text" value="Auto-generate saat dibuat" readonly class="readonly">
        </div>

        <!-- ACTION -->
        <div class="actions">
            <button type="button" class="btn btn-cancel">Batal</button>
            <button type="submit" class="btn btn-primary">Buat Tiket</button>
        </div>

    </form>

</div>

</body>
</html>
