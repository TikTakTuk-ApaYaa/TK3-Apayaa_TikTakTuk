<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Update Tiket</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #111827;
      --muted: #9ca3af;
      --border: #e5e7eb;
      --primary: #315bef;
      --primary-dark: #2449d8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.35);
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
    }

    .modal {
      width: min(560px, calc(100vw - 32px));
      background: var(--card);
      border-radius: 18px;
      padding: 28px 30px 30px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.18);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 26px;
    }

    .modal-title {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .close-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 32px;
      line-height: 1;
      cursor: pointer;
      padding: 0;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      color: #8b95a5;
      letter-spacing: 0.02em;
    }

    .readonly-box,
    select {
      width: 100%;
      height: 50px;
      border-radius: 17px;
      border: 1px solid var(--border);
      padding: 0 18px;
      font-size: 16px;
      color: #1f2937;
      background: #ffffff;
      outline: none;
    }

    .readonly-box {
      display: flex;
      align-items: center;
      background: #f9fafb;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .optional {
      color: #c4c9d2;
      text-transform: none;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 30px;
    }

    .btn {
      height: 48px;
      border-radius: 15px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #ffffff;
      color: #242832;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06);
    }

    .btn-primary {
      border-color: var(--primary);
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }
  </style>
</head>
<body>
  <form class="modal" method="post" action="{% url 'ticket_update' ticket.id %}">
    {% csrf_token %}

    <div class="modal-header">
      <h1 class="modal-title">Update Tiket</h1>
      <button class="close-btn" type="button" aria-label="Tutup">&times;</button>
    </div>

    <div class="form-group">
      <label>Kode Tiket</label>
      <div class="readonly-box">{{ ticket.ticket_code|default:"TTK-EVT001-VIP-001" }}</div>
    </div>

    <div class="form-group">
      <label for="status">Status</label>
      <select id="status" name="status">
        <option value="valid" {% if ticket.status == 'valid' %}selected{% endif %}>Valid</option>
        <option value="used" {% if ticket.status == 'used' %}selected{% endif %}>Terpakai</option>
        <option value="cancelled" {% if ticket.status == 'cancelled' %}selected{% endif %}>Dibatalkan</option>
      </select>
    </div>

    <div class="form-group" id="seat-field">
      <label for="seat">Kursi <span class="optional">(opsional)</span></label>
      <select id="seat" name="seat_id">
        <option value="">Tidak menggunakan kursi</option>
        {% for seat in available_seats %}
          <option value="{{ seat.id }}" {% if ticket.seat_id == seat.id %}selected{% endif %}>
            {{ seat.section }} — Baris {{ seat.row_number }}, No. {{ seat.seat_number }}
          </option>
        {% empty %}
          <option value="vip-b-1" selected>VIP — Baris B, No. 1</option>
        {% endfor %}
      </select>
    </div>

    <div class="actions">
      <button class="btn" type="button">Batal</button>
      <button class="btn btn-primary" type="submit">✓ Simpan</button>
    </div>
  </form>
</body>
</html>
