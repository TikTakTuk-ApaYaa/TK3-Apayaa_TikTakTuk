<!DOCTYPE html>
<html>
<head>
    <title>Tickets</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 p-8 font-sans">
<div class="max-w-7xl mx-auto">

    <!-- TITLE -->
    <div class="flex justify-between items-center mb-6">
        <div>
            <h2 class="text-2xl font-bold text-gray-900">
                Manajemen Tiket
            </h2>
            <div class="text-gray-600 mt-1">
                Kelola tiket: tambah, ubah status, dan hapus tiket
            </div>
        </div>

        <a href="#" class="bg-blue-600 text-white px-4 py-2 rounded-lg no-underline hover:bg-blue-700">+ Tambah Tiket</a>
    </div>

    <!-- STATS -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
        <div class="bg-white p-6 rounded-lg shadow">
            <div class="text-sm font-medium text-gray-500">TOTAL TIKET</div>
            <div class="text-2xl font-bold text-gray-900">30</div>
        </div>
        <div class="bg-white p-6 rounded-lg shadow">
            <div class="text-sm font-medium text-gray-500">VALID</div>
            <div class="text-2xl font-bold text-gray-900">25</div>
        </div>
        <div class="bg-white p-6 rounded-lg shadow">
            <div class="text-sm font-medium text-gray-500">TERPAKAI</div>
            <div class="text-2xl font-bold text-gray-900">5</div>
        </div>
    </div>

    <!-- FILTER -->
    <div class="flex gap-4 mb-6">
        <input type="text" placeholder="Cari kode tiket atau nama acara..." class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
        <select class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            <option>Semua Status</option>
            <option>Valid</option>
            <option>Terpakai</option>
        </select>
    </div>

    <!-- TICKETS -->
    <div class="bg-white rounded-lg shadow p-6 mb-4 flex justify-between items-start">
        <div class="flex gap-4">
            <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg"></div>

            <div class="flex-1">
                <div class="flex gap-2 mb-2">
                    <span class="inline-flex px-2 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-800">Valid</span>
                    <span class="inline-flex px-2 py-1 text-xs font-semibold rounded-full bg-blue-100 text-blue-800">VIP</span>
                </div>

                <h3 class="text-lg font-semibold text-gray-900">Concert A</h3>
                <p class="text-sm text-gray-600 mb-4">TKT001</p>

                <div class="grid grid-cols-3 gap-4 text-sm mb-4">
                    <div>
                        <div class="font-medium text-gray-500">Jadwal</div>
                        <div class="text-gray-900">2024-12-01 20:00</div>
                    </div>
                    <div>
                        <div class="font-medium text-gray-500">Lokasi</div>
                        <div class="text-gray-900">Stadion Gelora Bung Karno</div>
                    </div>
                    <div>
                        <div class="font-medium text-gray-500">Kursi</div>
                        <div class="text-gray-900">A1</div>
                    </div>
                    <div>
                        <div class="font-medium text-gray-500">Harga</div>
                        <div class="text-gray-900">500000</div>
                    </div>
                    <div>
                        <div class="font-medium text-gray-500">Order</div>
                        <div class="text-gray-900">ORD001</div>
                    </div>
                    <div>
                        <div class="font-medium text-gray-500">Pelanggan</div>
                        <div class="text-gray-900">John Doe</div>
                    </div>
                </div>

                <div class="flex gap-2">
                    <button class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Update</button>
                    <button class="bg-red-100 text-red-600 px-4 py-2 rounded-lg hover:bg-red-200">Hapus</button>
                </div>
            </div>
        </div>

        <div class="w-24 h-24 bg-gray-200 rounded-lg"></div>
    </div>

</div>

</body>
</html>
