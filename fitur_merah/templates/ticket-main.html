{% load static %}
<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manajemen Tiket - TikTakTuk</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="{% static 'css/main.css' %}" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  {% include '_navbar.html' %}

  <div class="main-content">
    {% include '_topbar.html' %}

    <div class="p-4">
      <div class="max-w-7xl mx-auto">

        <div class="flex justify-between items-center mb-6">
            <div>
                <h2 id="ticketTitle" class="text-2xl font-bold text-gray-900">Manajemen Tiket</h2>
                <div id="ticketSubtitle" class="text-gray-600 mt-1">Kelola tiket: tambah, ubah status, dan hapus tiket</div>
            </div>

            <button id="ticketCreateButton" type="button" onclick="openTicketModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">+ Tambah Tiket</button>
        </div>

        <!-- STATS -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            <div class="bg-white p-6 rounded-lg shadow">
                <div class="text-sm font-medium text-gray-500">TOTAL TIKET</div>
                <div id="ticketTotal" class="text-2xl font-bold text-gray-900">0</div>
            </div>
            <div class="bg-white p-6 rounded-lg shadow">
                <div class="text-sm font-medium text-gray-500">VALID</div>
                <div id="ticketValid" class="text-2xl font-bold text-gray-900">0</div>
            </div>
            <div class="bg-white p-6 rounded-lg shadow">
                <div class="text-sm font-medium text-gray-500">TERPAKAI</div>
                <div id="ticketUsed" class="text-2xl font-bold text-gray-900">0</div>
            </div>
        </div>

        <!-- FILTER -->
        <div id="ticketAlert" class="hidden mb-4 rounded-lg border px-4 py-3 text-sm"></div>

        <div class="flex gap-4 mb-6">
            <input id="ticketSearch" type="text" placeholder="Cari kode tiket atau nama acara..." class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            <select id="ticketStatusFilter" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option>Semua Status</option>
                <option>Valid</option>
                <option>Terpakai</option>
                <option>Pending</option>
                <option>Dibatalkan</option>
            </select>
        </div>

        <!-- TICKETS -->
        <div id="ticketList">
        </div>
      </div>
    </div>
  </div>

  <div id="ticketModal" class="hidden fixed inset-0 z-[2000] bg-black/40 flex items-center justify-center p-4">
    <form id="ticketForm" class="bg-white rounded-lg shadow-xl w-full max-w-lg p-6">
      <div class="flex items-center justify-between mb-5">
        <h3 id="ticketModalTitle" class="text-xl font-bold text-gray-900">Tambah Tiket</h3>
        <button type="button" onclick="closeTicketModal()" class="text-3xl leading-none text-gray-400 hover:text-gray-700">&times;</button>
      </div>
      <input id="ticketId" type="hidden">
      <div class="space-y-4">
        <label class="block">
          <span class="text-xs font-bold uppercase text-gray-500">Kode Tiket</span>
          <input id="ticketCode" class="mt-1 w-full border rounded-lg px-3 py-2" placeholder="Auto jika kosong">
        </label>
        <label class="block">
          <span class="text-xs font-bold uppercase text-gray-500">Kategori Tiket</span>
          <select id="ticketCategory" class="mt-1 w-full border rounded-lg px-3 py-2" required></select>
        </label>
        <label class="block">
          <span class="text-xs font-bold uppercase text-gray-500">Order</span>
          <select id="ticketOrder" class="mt-1 w-full border rounded-lg px-3 py-2" required></select>
        </label>
        <label class="block">
          <span class="text-xs font-bold uppercase text-gray-500">Kursi</span>
          <select id="ticketSeat" class="mt-1 w-full border rounded-lg px-3 py-2">
            <option value="">Tanpa kursi</option>
          </select>
        </label>
      </div>
      <div class="grid grid-cols-2 gap-3 mt-6">
        <button type="button" onclick="closeTicketModal()" class="border rounded-lg py-2 font-bold">Batal</button>
        <button type="submit" class="bg-blue-600 text-white rounded-lg py-2 font-bold">Simpan</button>
      </div>
    </form>
  </div>

  <div id="ticketDeleteModal" class="hidden fixed inset-0 z-[2000] bg-black/40 flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-lg p-6">
      <h3 class="text-xl font-bold text-red-600 mb-3">Hapus Tiket</h3>
      <p id="ticketDeleteText" class="text-gray-600">Apakah Anda yakin ingin menghapus tiket ini?</p>
      <div class="flex justify-end gap-3 mt-6">
        <button type="button" onclick="closeTicketDeleteModal()" class="border rounded-lg px-5 py-2 font-bold">Batal</button>
        <button id="ticketDeleteConfirm" type="button" class="bg-red-600 text-white rounded-lg px-5 py-2 font-bold">Hapus</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/navbar.js' %}"></script>
  <script>
  const ticketRole = '{{ role|default:"guest" }}';
  localStorage.setItem('role', ticketRole);
  renderSidebar(ticketRole);
  document.getElementById('topBarTitle').textContent = ticketRole === 'customer' ? 'Tiket Saya' : 'Manajemen Tiket';

  const API_TICKETS = '/api/merah/tickets/';
  const API_OPTIONS = '/api/merah/ticket-options/';
  let tickets = [];
  let ticketOptions = { categories: [], orders: [], seats: [] };
  let canManageTickets = false;
  let ticketPendingDeleteId = null;

  function showTicketAlert(message, type = 'danger') {
    const alert = document.getElementById('ticketAlert');
    alert.textContent = message;
    alert.className = `mb-4 rounded-lg border px-4 py-3 text-sm ${type === 'success' ? 'bg-green-50 border-green-200 text-green-700' : 'bg-red-50 border-red-200 text-red-700'}`;
    setTimeout(() => alert.classList.add('hidden'), 3500);
  }

  function formatRp(value) {
    return 'Rp ' + Number(value || 0).toLocaleString('id-ID');
  }

  async function loadTicketOptions() {
    if (!canManageTickets) return;
    const res = await fetch(API_OPTIONS);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Gagal memuat pilihan tiket.');
    ticketOptions = data;

    document.getElementById('ticketCategory').innerHTML = data.categories.map(category =>
      `<option value="${category.id}" data-venue="${category.venue_id}">${escapeHtml(category.event)} - ${escapeHtml(category.name)} (${formatRp(category.price)})</option>`
    ).join('');
    document.getElementById('ticketOrder').innerHTML = data.orders.map(order =>
      `<option value="${order.id}">${escapeHtml(order.customer)} - ${order.status} - ${order.id.slice(0, 8)}</option>`
    ).join('');
    renderSeatOptions();
  }

  function renderSeatOptions(selectedSeat = '') {
    const categoryId = document.getElementById('ticketCategory').value;
    const category = ticketOptions.categories.find(item => item.id === categoryId);
    const venueId = category?.venue_id;
    const options = ticketOptions.seats
      .filter(seat => !venueId || seat.venue_id === venueId || seat.id === selectedSeat)
      .map(seat => `<option value="${seat.id}" ${seat.id === selectedSeat ? 'selected' : ''}>${escapeHtml(seat.label)}</option>`)
      .join('');
    document.getElementById('ticketSeat').innerHTML = '<option value="">Tanpa kursi</option>' + options;
    if (selectedSeat) document.getElementById('ticketSeat').value = selectedSeat;
  }

  async function loadTickets() {
    const params = new URLSearchParams();
    const q = document.getElementById('ticketSearch').value.trim();
    const status = document.getElementById('ticketStatusFilter').value;
    if (q) params.set('q', q);
    if (status !== 'Semua Status') params.set('status', status);

    const res = await fetch(API_TICKETS + (params.toString() ? '?' + params.toString() : ''));
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Gagal memuat tiket.');
    tickets = data.tickets || [];
    canManageTickets = Boolean(data.can_manage);
    renderTickets(data.stats || {});
  }

  function renderTickets(stats) {
    document.getElementById('ticketCreateButton').classList.toggle('hidden', !canManageTickets);
    document.getElementById('ticketTotal').textContent = stats.total ?? tickets.length;
    document.getElementById('ticketValid').textContent = stats.valid ?? 0;
    document.getElementById('ticketUsed').textContent = stats.used ?? 0;
    document.getElementById('ticketTitle').textContent = ticketRole === 'customer' ? 'Tiket Saya' : 'Manajemen Tiket';
    document.getElementById('ticketSubtitle').textContent = ticketRole === 'customer'
      ? 'Kelola dan akses tiket pertunjukan Anda'
      : 'Kelola tiket, kategori, order, dan relasi kursi';
    document.getElementById('ticketList').innerHTML = tickets.map(ticket => `
      <div class="bg-white rounded-lg shadow p-6 mb-4 flex justify-between items-start">
        <div class="flex gap-4">
          <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg"></div>
          <div class="flex-1">
            <div class="flex gap-2 mb-2">
              <span class="inline-flex px-2 py-1 text-xs font-semibold rounded-full ${ticket.status === 'Valid' ? 'bg-green-100 text-green-800' : 'bg-orange-100 text-orange-800'}">${ticket.status}</span>
              <span class="inline-flex px-2 py-1 text-xs font-semibold rounded-full bg-blue-100 text-blue-800">${ticket.category}</span>
            </div>
            <h3 class="text-lg font-semibold text-gray-900">${escapeHtml(ticket.event)}</h3>
            <p class="text-sm text-gray-600 mb-4">${ticket.code}</p>
            <div class="grid grid-cols-3 gap-4 text-sm mb-4">
              <div><div class="font-medium text-gray-500">Jadwal</div><div class="text-gray-900">${ticket.datetime}</div></div>
              <div><div class="font-medium text-gray-500">Lokasi</div><div class="text-gray-900">${escapeHtml(ticket.venue)}</div></div>
              <div><div class="font-medium text-gray-500">Kursi</div><div class="text-gray-900">${escapeHtml(ticket.seat || '-')}</div></div>
              <div><div class="font-medium text-gray-500">Harga</div><div class="text-gray-900">${formatRp(ticket.price)}</div></div>
              <div><div class="font-medium text-gray-500">Order</div><div class="text-gray-900">${ticket.order_id.slice(0, 8)}</div></div>
              ${ticketRole === 'customer' ? '' : `<div><div class="font-medium text-gray-500">Pelanggan</div><div class="text-gray-900">${escapeHtml(ticket.customer)}</div></div>`}
            </div>
            <div class="flex gap-2">
              ${!canManageTickets
                ? '<button class="bg-black text-white px-4 py-2 rounded-lg hover:bg-gray-800">Tampilkan QR</button>'
                : `<button onclick="openTicketModal('${ticket.id}')" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Update</button>
                   <button onclick="openTicketDeleteModal('${ticket.id}')" class="bg-red-100 text-red-600 px-4 py-2 rounded-lg hover:bg-red-200">Hapus</button>`}
            </div>
          </div>
        </div>
        <div class="w-24 h-24 bg-gray-200 rounded-lg grid place-items-center text-xs text-gray-500">QR</div>
      </div>`).join('') || '<div class="bg-white rounded-lg shadow p-6 text-gray-600">Belum ada tiket yang sesuai.</div>';
  }

  async function openTicketModal(id = '') {
    if (!ticketOptions.categories.length) await loadTicketOptions();
    const ticket = tickets.find(item => item.id === id);
    document.getElementById('ticketModalTitle').textContent = ticket ? 'Update Tiket' : 'Tambah Tiket';
    document.getElementById('ticketId').value = ticket?.id || '';
    document.getElementById('ticketCode').value = ticket?.code || '';
    document.getElementById('ticketCategory').value = ticket?.category_id || ticketOptions.categories[0]?.id || '';
    document.getElementById('ticketOrder').value = ticket?.order_id || ticketOptions.orders[0]?.id || '';
    if (ticket?.seat_id && !ticketOptions.seats.some(seat => seat.id === ticket.seat_id)) {
      ticketOptions.seats.push({ id: ticket.seat_id, label: `${ticket.venue} - ${ticket.seat}`, venue_id: ticket.venue_id });
    }
    renderSeatOptions(ticket?.seat_id || '');
    document.getElementById('ticketModal').classList.remove('hidden');
  }

  function closeTicketModal() {
    document.getElementById('ticketModal').classList.add('hidden');
  }

  function openTicketDeleteModal(id) {
    const ticket = tickets.find(item => item.id === id);
    if (!ticket) return;
    ticketPendingDeleteId = id;
    document.getElementById('ticketDeleteText').textContent = `Hapus tiket ${ticket.code} untuk ${ticket.event}?`;
    document.getElementById('ticketDeleteModal').classList.remove('hidden');
  }

  function closeTicketDeleteModal() {
    ticketPendingDeleteId = null;
    document.getElementById('ticketDeleteModal').classList.add('hidden');
  }

  document.getElementById('ticketForm').addEventListener('submit', async event => {
    event.preventDefault();
    const id = document.getElementById('ticketId').value;
    const payload = {
      ticket_code: document.getElementById('ticketCode').value.trim(),
      category_id: document.getElementById('ticketCategory').value,
      order_id: document.getElementById('ticketOrder').value,
      seat_id: document.getElementById('ticketSeat').value
    };
    try {
      const res = await fetch(id ? API_TICKETS + id + '/' : API_TICKETS, {
        method: id ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Gagal menyimpan tiket.');
      closeTicketModal();
      showTicketAlert(data.message || 'Tiket berhasil disimpan.', 'success');
      ticketOptions = { categories: [], orders: [], seats: [] };
      await loadTickets();
    } catch (err) {
      showTicketAlert(err.message);
    }
  });

  document.getElementById('ticketDeleteConfirm').addEventListener('click', async () => {
    try {
      const res = await fetch(API_TICKETS + ticketPendingDeleteId + '/', { method: 'DELETE' });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Gagal menghapus tiket.');
      closeTicketDeleteModal();
      showTicketAlert(data.message || 'Tiket berhasil dihapus.', 'success');
      await loadTickets();
    } catch (err) {
      showTicketAlert(err.message);
    }
  });

  function escapeHtml(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  document.getElementById('ticketCategory').addEventListener('change', () => renderSeatOptions());
  document.getElementById('ticketSearch').addEventListener('input', loadTickets);
  document.getElementById('ticketStatusFilter').addEventListener('change', loadTickets);
  loadTickets().then(loadTicketOptions).catch(err => showTicketAlert(err.message));
  </script>
</body>
</html>
